version: 2

models:
  - name: dim_store
    description: "Dimension table for store."
    columns:
      - name: store_number
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
  - name: dim_item
    description: "Dimension table for item."
    columns:
      - name: item_number
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
      - name: pack
        description: "The number of bottles in a pack" 
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 160
      - name: bottle_volume_ml
        description: "The volume of the bottle in mililiters" 
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 378000   
